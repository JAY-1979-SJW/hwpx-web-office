name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  pytest:
    # 저장소가 Windows 전용 도구(COM 자동화, .ps1 스크립트, 한컴 연동)에
    # 의존하는 부분이 있어 Windows 에서 돌린다.
    # 2026-10-16 대표님 지시: 러너 전용 PC(해한소프트)의 자체 호스팅 러너(haehan-win-hwpx, 서비스)로 옮긴다.
    # 그 러너의 toolcache 에 Python 3.13.5 를 넣어 두어 setup-python 이 새로 설치하지 않는다.
    runs-on: [self-hosted, Windows, X64, haehan-win-hwpx]
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          # 이 저장소는 회귀 잠금 테스트가 "git diff <옛 커밋> -- <파일>"로
          # 과거 baseline 커밋과 비교한다 — 기본 얕은 클론(fetch-depth: 1)
          # 이면 그 커밋이 없어서 "bad revision"으로 조용히 빈 결과가 되고
          # 여러 테스트가 오판정됐다(2026-09-28 완성도 감사에서 실측).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q
