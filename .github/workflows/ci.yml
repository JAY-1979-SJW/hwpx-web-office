name: CI

on:
  push:
  pull_request:
    branches: [master, chore/absorb-33-hwpx]

jobs:
  pytest:
    # 저장소가 Windows 전용 도구(COM 자동화, .ps1 스크립트, 한컴 연동)에
    # 의존하는 부분이 있어 windows-latest 로 고정한다.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          # 이 저장소는 회귀 잠금 테스트가 "git diff <옛 커밋> -- <파일>"로
          # 과거 baseline 커밋과 비교한다 — 기본 얕은 클론(fetch-depth: 1)
          # 이면 그 커밋이 없어서 "bad revision"으로 조용히 빈 결과가 되고
          # 여러 테스트가 오판정됐다(2026-09-28 완성도 감사에서 실측).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tracked files must not match .gitignore
        # 추적 중인 파일이 무시 규칙에 걸리면 같은 폴더의 새 파일이 조용히 커밋에서 빠진다.
        # data/reports/ 는 `data/` 규칙 아래 게이트가 강제 추가한 산출물이라 제외(그 외는 0 이어야 한다).
        shell: bash
        run: |
          bad=$(git ls-files -i -c --exclude-standard | grep -v '^data/reports/' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo 'tracked files match .gitignore'; exit 1; fi

      - name: Public hygiene audit
        # 추적 파일에 개인 절대경로·비밀값이 들어갔는지 검사한다(값은 출력하지 않음).
        run: python scripts/ops/audit_public_repo_hygiene.py

      - name: Run pytest
        run: python -m pytest -q

  audit-kit-new-findings:
    # 레이어 계약(import-linter)을 지키고, 이번 PR 로 audit-kit finding 이 늘지 않았는지 본다.
    # 비교 대상은 병합 대상 브랜치 끝을 같은 환경에서 새로 잰 값이라 저장된 기준선 숫자가 없다
    # (올려서 통과시킬 수 없고, 줄이면 다음 PR 의 기준이 자동으로 낮아진다). 상세: scripts/ops/gate_audit_kit_new_findings.py
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install audit-kit (pinned)
        # audit-kit 는 공개 저장소 커밋 고정으로 설치한다(같은 결과를 재현하려고 브랜치가 아닌 커밋을 쓴다).
        run: |
          python -m venv "$RUNNER_TEMP/ak"
          "$RUNNER_TEMP/ak/bin/pip" install --quiet "git+https://github.com/JAY-1979-SJW/audit-kit@45430c9005c414a347c19748785e800afd223f5c"

      - name: Layer contracts (import-linter)
        # pyproject.toml [tool.importlinter] — hwpx 하위 패키지 방향. 위반이 있으면 실패한다.
        run: PYTHONPATH=".:scripts" "$RUNNER_TEMP/ak/bin/lint-imports"

      - name: No new audit-kit findings vs base branch
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          python scripts/ops/gate_audit_kit_new_findings.py \
            --base-tree "$RUNNER_TEMP/base" \
            --head-tree "$GITHUB_WORKSPACE" \
            --kit "$RUNNER_TEMP/ak/bin/audit-kit"
