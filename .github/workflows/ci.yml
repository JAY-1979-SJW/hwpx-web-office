name: CI

on:
  push:
  pull_request:
    branches: [master, chore/absorb-33-hwpx]

jobs:
  pytest:
    # 저장소가 Windows 전용 도구(COM 자동화, .ps1 스크립트, 한컴 연동)에
    # 의존하는 부분이 있어 windows-latest 로 고정한다.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          # 이 저장소는 회귀 잠금 테스트가 "git diff <옛 커밋> -- <파일>"로
          # 과거 baseline 커밋과 비교한다 — 기본 얕은 클론(fetch-depth: 1)
          # 이면 그 커밋이 없어서 "bad revision"으로 조용히 빈 결과가 되고
          # 여러 테스트가 오판정됐다(2026-09-28 완성도 감사에서 실측).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tracked files must not match .gitignore
        # 추적 중인 파일이 무시 규칙에 걸리면 같은 폴더의 새 파일이 조용히 커밋에서 빠진다.
        # data/reports/ 는 `data/` 규칙 아래 게이트가 강제 추가한 산출물이라 제외(그 외는 0 이어야 한다).
        shell: bash
        run: |
          bad=$(git ls-files -i -c --exclude-standard | grep -v '^data/reports/' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo 'tracked files match .gitignore'; exit 1; fi

      - name: Public hygiene audit
        # 추적 파일에 개인 절대경로·비밀값이 들어갔는지 검사한다(값은 출력하지 않음).
        run: python scripts/ops/audit_public_repo_hygiene.py

      - name: Run pytest
        run: python -m pytest -q
